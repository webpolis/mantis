[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
dynamic = ["version"]
description = "Metacognitive Adaptive Network with Tiered Inference Strategies - a research LLM architecture for hallucination mitigation and long-context memory"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicolás Iglesias", email = "nfiglesias@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "numpy>=2.4.2",
    "tqdm>=4.67.3",
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
]

[project.optional-dependencies]
# Stage 2/3 memory systems and the full inference engine (mamba-ssm needs CUDA)
memory = ["mamba-ssm>=2.2.2", "faiss-cpu>=1.13.2"]
# --deepspeed (ZeRO-2, --cpu-offload)
distributed = ["deepspeed>=0.18.5"]
# --use-8bit-optimizer
bnb = ["bitsandbytes>=0.49.1"]
# --wandb logging
wandb = ["wandb>=0.24.2"]
# web/server: the simulation playground backend
web = ["flask>=3.0.0", "flask-socketio>=5.3.5", "python-socketio>=5.10.0"]

[dependency-groups]
dev = ["pytest>=9.0.2", "black>=26.1.0", "flake8>=7.3.0"]

[tool.setuptools.dynamic]
version = { attr = "mantis.__version__" }

[tool.setuptools.packages.find]
include = ["mantis*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.9"

# CUDA builds of torch; the PyPI wheels are CPU-only on Linux
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

# Source-built packages whose setup.py imports torch
[tool.uv.extra-build-dependencies]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]
deepspeed = [{ requirement = "torch", match-runtime = true }]
